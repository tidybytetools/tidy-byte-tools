[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tidy-byte-tools"
version = "0.1.1"
description = "One install and one MCP server for the Tidy Byte Tools lite CLIs: repair JSON, extract PDF tables, convert documents to Markdown, and more. Runs locally. No API key."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Tidy Byte Tools"}]
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.10,<2",
  "json-shaper-lite>=1.1.2",
  "md-chunk-lite>=1.1.1",
  "doc2md-lite>=1.2.2",
  "pdf-table-pull-lite>=1.3.1",
  "link-check-lite>=1.1.4",
  "json-repair-lite>=1.0.1",
  "base64-lite>=1.0.1",
  "tidy-hash-lite>=1.0.1",
]
keywords = ["mcp", "mcp-server", "json", "markdown", "pdf", "data-cleaning", "developer-tools", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/tidybytetools/tidy-byte-tools"
Documentation = "https://github.com/tidybytetools/tidy-byte-tools#readme"
Source = "https://github.com/tidybytetools/tidy-byte-tools"
Issues = "https://github.com/tidybytetools/tidy-byte-tools/issues"
Changelog = "https://github.com/tidybytetools/tidy-byte-tools/blob/main/CHANGELOG.md"
Apify = "https://apify.com/tidybytetools"
API = "https://tidybytetools.tidybytetools.workers.dev"
Website = "https://tidybytetools.github.io"

[project.scripts]
tidy-byte-tools = "tidy_byte_tools:main"
tbt = "tidy_byte_tools:main"
tidy-byte-tools-mcp = "tidy_byte_tools_mcp:main"

[tool.setuptools]
py-modules = ["tidy_byte_tools", "tidy_byte_tools_mcp"]
